<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Quiz Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="quiz-container">

         <!-- Naya Top Header -->
        <header class="app-header">
            Created with <span class="heart">♥</span> for Priya by Anuj
        </header>

        <!-- Start Screen -->
        <div id="start-screen" class="card active">
           <h1>AB Mock </h1>
            <p|>Select Your Challenge</p>
            
            <select id="quiz-select">
                <option value="geo_part1">Geography - Set 1</option>
                <option value="geo_part2"> Geography - Set 2</option>
                <option value="geo_part3">Geography - Set 3 </option>
                <option value="geo_part4">Geography - Set 4</option>
            </select>

            <button id="start-btn" onclick="startQuiz()">Starts Now</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="card hidden">
            <div class="quiz-header">
                <span id="question-number">प्रश्न 1 / 10</span>
                <span id="score-counter">स्कोर: 0</span>
            </div>
            <h2 id="question-text">प्रश्न यहाँ दिखेगा...</h2>
            <div id="options-container" class="options-grid"></div>
            <div id="explanation-box" class="explanation hidden"></div>
            <button id="next-btn" class="hidden" onclick="nextQuestion()">अगला प्रश्न</button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="card hidden">
            <h2>क्विज़ पूरा हुआ!</h2>
            <div class="final-score" id="final-score">आपका स्कोर: 0 / 10</div>
            <button onclick="restartQuiz()">फिर से प्रयास करें</button>
        </div>
    </div>

    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
